# ===================================================================
# Full-Stack E-Commerce Application Configuration (Java 8 / Spring Boot 2.7.x)
# ===================================================================

spring.application.name=ecommerce-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Active Profiles: 'h2' for local instant run, 'mysql' for MySQL production
spring.profiles.active=h2

# JSON / Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Multipart File Upload (for product images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=9a6f8b2c4e1d7a3f5b8c9d0e2f4a6b8c1d3e5f7a9b0c2d4e6f8a1b3c5d7e9f0a
app.jwt.expiration-ms=86400000

# ===================================================================
# H2 In-Memory / File Database Profile (Default)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.security=WARN
