<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-dark text-white mb-3 shadow">
                        <i class="fa-solid fa-shield-halved fs-2 text-warning"></i>
                    </div>
                    <h2 class="h4 fw-bold">Admin Portal Login</h2>
                    <p class="text-muted small">Restricted area for store managers and administrators.</p>
                </div>

                <form ng-submit="doAdminLogin()">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user-shield text-muted"></i></span>
                            <input type="text" class="form-control" placeholder="admin" ng-model="loginData.usernameOrEmail" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Admin Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" ng-model="loginData.password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold shadow" ng-disabled="submitting">
                        <span ng-if="!submitting"><i class="fa-solid fa-right-to-bracket me-2"></i>Access Admin Dashboard</span>
                        <span ng-if="submitting"><i class="fa-solid fa-spinner fa-spin me-1"></i> Verifying...</span>
                    </button>
                </form>

                <div class="alert alert-warning bg-light border p-3 mt-4 mb-0 small">
                    <div class="fw-bold mb-1 text-dark"><i class="fa-solid fa-key me-1 text-warning"></i> Default Admin Credentials:</div>
                    <div><strong>Username:</strong> <code>admin</code></div>
                    <div><strong>Password:</strong> <code>admin123</code></div>
                </div>

                <div class="text-center mt-3 small">
                    <a href="#/login" class="text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Customer Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
