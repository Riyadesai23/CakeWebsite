<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="brand-font fs-3 fw-bold text-primary mb-1">
                        <i class="fa-solid fa-cake-candles text-primary me-1"></i> Bake My Day
                    </div>
                    <h2 class="h4 fw-bold">Create Your Account</h2>
                    <p class="text-muted small">Join thousands of happy customers shopping today.</p>
                </div>

                <form ng-submit="doRegister()">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">First Name *</label>
                            <input type="text" class="form-control" placeholder="John" ng-model="registerData.firstName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Last Name</label>
                            <input type="text" class="form-control" placeholder="Doe" ng-model="registerData.lastName">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold text-muted">Username *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">@</span>
                                <input type="text" class="form-control" placeholder="username" ng-model="registerData.username" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold text-muted">Email Address *</label>
                            <input type="email" class="form-control" placeholder="name@example.com" ng-model="registerData.email" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Phone Number</label>
                            <input type="text" class="form-control" placeholder="+91 9876543210" ng-model="registerData.phone">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Password *</label>
                            <input type="password" class="form-control" placeholder="Min 6 characters" ng-model="registerData.password" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 mt-4 fw-bold shadow-sm" ng-disabled="submitting">
                        <span ng-if="!submitting">Create Account <i class="fa-solid fa-arrow-right ms-1"></i></span>
                        <span ng-if="submitting"><i class="fa-solid fa-spinner fa-spin me-1"></i> Creating account...</span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Already have an account? <a href="#/login" class="fw-bold text-primary">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
