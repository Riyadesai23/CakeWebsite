<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#/home">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">My Profile</li>
                </ol>
            </nav>

            <div class="card-custom p-4">
                <div class="d-flex align-items-center gap-3 pb-3 border-bottom mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 60px; height: 60px;">
                        {{user.firstName ? user.firstName.charAt(0).toUpperCase() : 'U'}}
                    </div>
                    <div>
                        <h2 class="h4 fw-bold mb-0">{{user.firstName}} {{user.lastName}}</h2>
                        <div class="text-muted small"><i class="fa-regular fa-envelope me-1"></i>{{user.email}} | <strong>@{{user.username}}</strong></div>
                    </div>
                </div>

                <form ng-submit="saveProfile()">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">First Name *</label>
                            <input type="text" class="form-control" ng-model="form.firstName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Last Name</label>
                            <input type="text" class="form-control" ng-model="form.lastName">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Phone Number</label>
                            <input type="text" class="form-control" ng-model="form.phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Change Password (Leave blank to keep current)</label>
                            <input type="password" class="form-control" placeholder="New password" ng-model="form.password">
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                        <a href="#/orders" class="btn btn-outline-secondary btn-sm">
                            <i class="fa-solid fa-cake-candles me-1"></i> View My Bakery Orders
                        </a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold" ng-disabled="saving">
                            <span ng-if="!saving"><i class="fa-solid fa-floppy-disk me-1"></i> Save Changes</span>
                            <span ng-if="saving"><i class="fa-solid fa-spinner fa-spin me-1"></i> Saving...</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
