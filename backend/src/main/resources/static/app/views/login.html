<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="brand-font fs-3 fw-bold text-primary mb-1">
                        <i class="fa-solid fa-cake-candles text-primary me-1"></i> Bake My Day
                    </div>
                    <h2 class="h4 fw-bold">Sign In to Your Account</h2>
                    <p class="text-muted small">Welcome back! Please enter your details.</p>
                </div>

                <form ng-submit="doLogin()">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" class="form-control" placeholder="john_doe or user@example.com" ng-model="loginData.usernameOrEmail" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" ng-model="loginData.password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm" ng-disabled="submitting">
                        <span ng-if="!submitting">Sign In <i class="fa-solid fa-arrow-right ms-1"></i></span>
                        <span ng-if="submitting"><i class="fa-solid fa-spinner fa-spin me-1"></i> Signing in...</span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Don't have an account? <a href="#/register" class="fw-bold text-primary">Sign up for free</a>
                </div>

                <!-- Demo Credentials Box -->
                <div class="alert alert-info bg-light border p-3 mt-4 mb-0 small">
                    <div class="fw-bold mb-1 text-primary"><i class="fa-solid fa-circle-info me-1"></i> Demo Customer Credentials:</div>
                    <div><strong>Username:</strong> <code>john_doe</code></div>
                    <div><strong>Password:</strong> <code>password123</code></div>
                    <div class="mt-1"><a href="#/admin/login" class="text-secondary"><i class="fa-solid fa-shield-halved me-1"></i>Admin Portal Login</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
